<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Carrinho
</title>

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/carrinho.css">

</head>

<body>

<!-- HEADER -->
<header class="cart-header">

<a href="../index.html"
class="voltar">

←

</a>

<div class="cart-logo">

<img src="../assets/images/logo.png">

</div>

<div class="cart-space"></div>

</header>

<!-- MAIN -->
<main class="cart-layout">

<!-- PRODUTOS -->
<section class="cart-produtos">

<h2>

Produtos adicionados

</h2>

<div
id="lista"
class="cart-grid">

</div>

</section>

<!-- RESUMO -->
<aside class="resumo-box">

<h2>

Resumo do pedido

</h2>

<div class="resumo-linha">

<span>

Subtotal

</span>

<strong id="subtotal">

R$ 0.00

</strong>

</div>

<div class="resumo-linha">

<span>

Frete

</span>

<strong id="freteValor">

Grátis

</strong>

</div>

<div class="resumo-linha total">

<span>

Total

</span>

<strong id="total">

R$ 0.00

</strong>

</div>

<!-- FRETE -->
<div class="frete-box">

<h3>

Calcular frete

</h3>

<div class="frete-input">

<input
type="text"
id="cep"
placeholder="Digite seu CEP">

<button
type="button"
onclick="calcularFrete()">

Calcular

</button>

</div>

<div
class="frete-resultado"
id="freteResultado">

</div>

</div>

<!-- PAGAMENTO -->
<div class="pagamento">

<h3>

Forma de pagamento

</h3>

<div class="pagamento-grid">

<button
type="button"
class="pay active">

💳 Cartão

</button>

<button
type="button"
class="pay">

PIX

</button>

<button
type="button"
class="pay">

Boleto

</button>

</div>

<!-- BANDEIRAS -->
<div class="bandeiras">

<img
src="../assets/images/visa.png"
alt="Visa">

<img
src="../assets/images/mastercard.png"
alt="Mastercard">

<img
src="../assets/images/elo.png"
alt="Elo">

<img
src="../assets/images/pix.png"
alt="Pix">

</div>

</div>

<button
type="button"
onclick="finalizarCompra()"
class="checkout">

Finalizar Compra

</button>

</aside>

</main>

<!-- FOOTER -->
<footer class="footer">

<div class="footer-content">

<div class="footer-brand">

<img src="../assets/images/logo.png">

<p>

Tecnologia, confiança e qualidade
no agronegócio brasileiro.

</p>

</div>

<div class="footer-links">

<h3>

Navegação

</h3>

<a href="../index.html">

Home

</a>

<a href="../pages/produtos.html">

Produtos

</a>

</div>

<div class="footer-contact">

<h3>

Contato

</h3>

<p>

Barraagropecuariaadm@gmail.com

</p>

<p>

Brasil

</p>

</div>

</div>

<div class="footer-bottom">

© 2026 Barra Agropecuária

</div>

</footer>

<script>

/* =========================
PAGAMENTO
========================= */

const botoesPagamento =

document.querySelectorAll(".pay");

/* LOOP */
botoesPagamento.forEach(botao => {

botao.addEventListener(

"click",

function() {

/* REMOVE ACTIVE */
botoesPagamento.forEach(btn => {

btn.classList.remove(
"active"
);

});

/* ADD ACTIVE */
this.classList.add(
"active"
);

}

);

});

/* =========================
CARRINHO
========================= */

let freteAtual = 0;

function carregarCarrinho() {

const carrinho =

JSON.parse(
localStorage.getItem(
"carrinho"
)
) || [];

const lista =

document.getElementById(
"lista"
);

const totalEl =

document.getElementById(
"total"
);

const subtotalEl =

document.getElementById(
"subtotal"
);

lista.innerHTML = "";

let subtotal = 0;

/* LOOP */
carrinho.forEach((p, i) => {

subtotal += p.preco;

const div =
document.createElement("div");

div.classList.add(
"cart-item"
);

div.innerHTML = `

<img
src="${
p.imagem ||
'../assets/images/fazendawallpaper.jpg'
}">

<div class="cart-info">

<h3>

${p.nome}

</h3>

<p>

Produto Premium Agro

</p>

<div class="quantidade">

<button onclick="diminuir(${i})">

−

</button>

<span>

1

</span>

<button onclick="aumentar(${i})">

+

</button>

</div>

<strong>

R$ ${p.preco.toFixed(2)}

</strong>

</div>

<button
class="remove"
onclick="remover(${i})">

✕

</button>

`;

lista.appendChild(div);

});

/* TOTAL */
const total = subtotal + freteAtual;

subtotalEl.innerText =

`R$ ${subtotal.toFixed(2)}`;

totalEl.innerText =

`R$ ${total.toFixed(2)}`;

}

/* REMOVER */
function remover(index) {

let carrinho =

JSON.parse(
localStorage.getItem(
"carrinho"
)
);

carrinho.splice(index, 1);

localStorage.setItem(

"carrinho",

JSON.stringify(carrinho)

);

carregarCarrinho();

}

/* QUANTIDADE */
function aumentar(index) {

alert(
"Sistema de quantidade em breve"
);

}

function diminuir(index) {

alert(
"Sistema de quantidade em breve"
);

}

/* FRETE */
function calcularFrete() {

const cep =

document.getElementById(
"cep"
).value;

const box =

document.getElementById(
"freteResultado"
);

const freteValor =

document.getElementById(
"freteValor"
);

/* VALIDAÇÃO */
if(cep.length < 8) {

alert(
"Digite um CEP válido"
);

return;

}

/* SUDESTE */
let valor = 18.90;

let prazo = "2 dias úteis";

/* SUL */
if(

cep.startsWith("8") ||
cep.startsWith("9")

) {

valor = 24.90;

prazo = "4 dias úteis";

}

/* NORTE */
if(

cep.startsWith("6") ||
cep.startsWith("7")

) {

valor = 39.90;

prazo = "8 dias úteis";

}

freteAtual = valor;

/* RESULTADO */
box.style.display = "block";

box.innerHTML = `

<strong>

Frete: R$ ${valor}

</strong>

<p>

Entrega em ${prazo}

</p>

`;

freteValor.innerText =

`R$ ${valor.toFixed(2)}`;

carregarCarrinho();

}

/* FINALIZAR */
function finalizarCompra() {

const carrinho =

JSON.parse(
localStorage.getItem(
"carrinho"
)
) || [];

/* VAZIO */
if(carrinho.length === 0) {

alert(
"Carrinho vazio!"
);

return;

}

let total = 0;

carrinho.forEach(p => {

total += p.preco;

});

total += freteAtual;

/* ENVIAR */
fetch(

"http://localhost:3000/pedido",

{

method: "POST",

headers: {

"Content-Type":
"application/json"

},

body: JSON.stringify({

produtos: carrinho,

frete: freteAtual,

total: total

})

}

)

.then(res => res.json())

.then(data => {

alert(

"Pedido realizado com sucesso!"

);

localStorage.removeItem(
"carrinho"
);

location.reload();

});

}

/* INIT */
carregarCarrinho();

</script>

</body>
</html>
