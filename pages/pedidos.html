<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Meus Pedidos
</title>

<link
rel="stylesheet"
href="/css/style.css">
<header class="header-premium">

<div class="logo-area">

<a href="/index.html">

<img
src="/assets/images/logo.png"
class="logo">

</a>

</div>

<div class="header-actions">

<button
class="voltar-btn"
onclick="window.history.back()">

← Voltar

</button>

</div>

</header>
<style>
/* =========================
HEADER
========================= */

.header-premium {

width: 100%;

display: flex;

justify-content: space-between;

align-items: center;

padding: 20px 40px;

background:
rgba(0,0,0,.25);

backdrop-filter:
blur(12px);

border-bottom:
1px solid rgba(255,255,255,.05);

position: sticky;

top: 0;

z-index: 999;

}

.logo {

width: 270px;

object-fit: contain;

}

/* =========================
VOLTAR
========================= */

.voltar-btn {

background:
linear-gradient(
135deg,
#1fc15a,
#11853d
);

border: none;

color: white;

padding: 20px 24px;

border-radius: 16px;

font-size: 15px;

font-weight: 700;

cursor: pointer;

transition: .3s;

}

.voltar-btn:hover {

transform:
translateY(-2px);

}
body {

background:
#02140d;

font-family:
Arial, sans-serif;

color:
white;

}

/* =========================
CONTAINER
========================= */

.pedidos-container {

width:
90%;

max-width:
1200px;

margin:
40px auto;

}

/* =========================
TITLE
========================= */

.pedidos-title {

font-size:
42px;

font-weight:
700;

margin-bottom:
40px;

}

/* =========================
CARD
========================= */

.pedido-card {

background:
linear-gradient(
180deg,
#03351f,
#02140d
);

border:
1px solid rgba(0,255,120,.15);

border-radius:
28px;

padding:
30px;

margin-bottom:
25px;

box-shadow:
0 0 25px rgba(0,255,120,.08);

}

/* =========================
TOP
========================= */

.pedido-top {

display:
flex;

justify-content:
space-between;

align-items:
center;

margin-bottom:
25px;

flex-wrap:
wrap;

gap:
15px;

}

.pedido-id {

font-size:
20px;

font-weight:
700;

}

.pedido-status {

padding:
10px 18px;

border-radius:
999px;

font-size:
14px;

font-weight:
700;

background:
#1fc15a;

color:
white;

}

/* =========================
PRODUTOS
========================= */

.pedido-produtos {

display:
flex;

flex-direction:
column;

gap:
15px;

}

.produto-item {

display:
flex;

align-items:
center;

gap:
20px;

background:
rgba(255,255,255,.03);

padding:
15px;

border-radius:
18px;

}

.produto-item img {

width:
90px;

height:
90px;

object-fit:
cover;

border-radius:
16px;

}

.produto-info h3 {

font-size:
18px;

margin-bottom:
6px;

}

.produto-info p {

opacity:
.7;

}

/* =========================
BOTTOM
========================= */

.pedido-bottom {

margin-top:
25px;

display:
flex;

justify-content:
space-between;

align-items:
center;

flex-wrap:
wrap;

gap:
15px;

}

.pedido-total {

font-size:
26px;

font-weight:
700;

color:
#29d466;

}

/* =========================
TIMELINE
========================= */

.timeline {

margin-top:
30px;

display:
flex;

justify-content:
space-between;

gap:
15px;

flex-wrap:
wrap;

}

.timeline-step {

flex:
1;

min-width:
120px;

background:
rgba(255,255,255,.03);

padding:
18px;

border-radius:
20px;

text-align:
center;

border:
1px solid rgba(255,255,255,.05);

}

.timeline-step.active {

background:
rgba(41,212,102,.12);

border:
1px solid #29d466;

}

.timeline-step h4 {

font-size:
15px;

margin-top:
10px;

}

.timeline-step span {

font-size:
13px;

opacity:
.7;

}

/* =========================
EMPTY
========================= */

.sem-pedidos {

text-align:
center;

padding:
100px 20px;

opacity:
.7;

}

</style>

</head>

<body>

<div class="pedidos-container">

<h1 class="pedidos-title">

Meus pedidos

</h1>

<div id="pedidosLista">

</div>

</div>

<script>

/* =========================
PEDIDOS
========================= */

const pedidos =

JSON.parse(
localStorage.getItem(
"pedidos"
)
) || [];

/* =========================
LISTA
========================= */

const pedidosLista =
document.getElementById(
"pedidosLista"
);

/* EMPTY */

if(pedidos.length === 0) {

pedidosLista.innerHTML =

`

<div class="sem-pedidos">

<h2>
Você ainda não possui pedidos
</h2>

</div>

`;

}

/* LOOP */

pedidos.forEach(pedido => {

const div =
document.createElement(
"div"
);

div.classList.add(
"pedido-card"
);

/* PRODUTOS */

let produtosHTML = "";

pedido.produtos.forEach(produto => {

produtosHTML += `

<div class="produto-item">

<img
src="${produto.imagem}">

<div class="produto-info">

<h3>
${produto.nome}
</h3>

<p>
R$ ${produto.preco}
</p>

</div>

</div>

`;

});

/* HTML */

div.innerHTML = `

<div class="pedido-top">

<div class="pedido-id">

Pedido #${pedido.id}

</div>

<div class="pedido-status">

${pedido.status}

</div>

</div>

<div class="pedido-produtos">

${produtosHTML}

</div>

<div class="pedido-bottom">

<div class="pedido-total">

R$ ${pedido.total}

</div>

</div>

<div class="timeline">

<div class="timeline-step active">

📦

<h4>
Pedido realizado
</h4>

<span>
Confirmado
</span>

</div>

<div class="timeline-step active">

💰

<h4>
Pagamento
</h4>

<span>
Aprovado
</span>

</div>

<div class="timeline-step">

🚚

<h4>
Envio
</h4>

<span>
Preparando
</span>

</div>

<div class="timeline-step">

🏠

<h4>
Entregue
</h4>

<span>
Aguardando
</span>

</div>

</div>

`;

pedidosLista.appendChild(div);

});

</script>

</body>

</html>
