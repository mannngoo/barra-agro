<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Meus Pedidos
</title>

<link
rel="stylesheet"
href="/css/pedidos.css">

</head>

<body>

<header class="header-premium">

<div class="logo-area">

<a href="/index.html">

<img
src="/assets/images/logo.png"
class="logo">

</a>

</div>

<div class="header-actions">

<button
class="voltar-btn"
onclick="window.history.back()">

← Voltar

</button>

</div>

</header>

<div class="pedidos-container">

<h1 class="pedidos-title">

Meus pedidos

</h1>

<div id="pedidosLista">

</div>

</div>

<footer class="footer">

<div class="footer-content">

<img
src="/assets/images/logo.png"
class="footer-logo">

<p>

© 2026 Barra Agro —
Todos os direitos reservados

</p>

</div>

</footer>

<script>

/* =========================
PEDIDOS
========================= */

const pedidos =

JSON.parse(
localStorage.getItem(
"pedidos"
)
) || [];

/* =========================
LISTA
========================= */

const pedidosLista =
document.getElementById(
"pedidosLista"
);

/* EMPTY */

if(pedidos.length === 0) {

pedidosLista.innerHTML =

`

<div class="sem-pedidos">

<h2>
Você ainda não possui pedidos
</h2>

</div>

`;

}

/* LOOP */

pedidos.forEach(pedido => {

const div =
document.createElement(
"div"
);

div.classList.add(
"pedido-card"
);

/* PRODUTOS */

let produtosHTML = "";

pedido.produtos.forEach(produto => {

produtosHTML += `

<div class="produto-item">

<img
src="${produto.imagem}">

<div class="produto-info">

<h3>
${produto.nome}
</h3>

<p>
R$ ${produto.preco}
</p>

</div>

</div>

`;

});

/* HTML */

div.innerHTML = `

<div class="pedido-top">

<div class="pedido-id">

Pedido #${pedido.id}

</div>

<div class="pedido-status">

${pedido.status}

</div>

</div>

<div class="pedido-produtos">

${produtosHTML}

</div>

<div class="pedido-bottom">

<div class="pedido-total">

R$ ${pedido.total}

</div>

</div>

<div class="timeline">

<div class="timeline-step active">

📦

<h4>
Pedido realizado
</h4>

<span>
Confirmado
</span>

</div>

<div class="timeline-step active">

💰

<h4>
Pagamento
</h4>

<span>
Aprovado
</span>

</div>

<div class="timeline-step">

🚚

<h4>
Envio
</h4>

<span>
Preparando
</span>

</div>

<div class="timeline-step">

🏠

<h4>
Entregue
</h4>

<span>
Aguardando
</span>

</div>

</div>

`;

pedidosLista.appendChild(div);

});

</script>

</body>

</html>
