<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Cadastro
    </title>

    <link rel="stylesheet"
          href="css/global.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <img src="assets/images/logo.png"
             class="login-logo">

        <h1>
            Criar conta
        </h1>

        <input type="text"
               id="nome"
               placeholder="Seu nome">

        <input type="email"
               id="email"
               placeholder="Seu email">

        <input type="password"
               id="senha"
               placeholder="Sua senha">

        <button onclick="cadastro()">

            Cadastrar

        </button>

        <p>

            Já possui conta?

            <a href="login.html">
                Fazer login
            </a>

        </p>

    </div>

</div>

<script src="js/cadastro.js"></script>

</body>
</html>
