<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Painel Admin
</title>

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/admin.css">

</head>

<body>

<!-- HEADER -->
<header class="admin-header">

<h1>

Painel Administrativo

</h1>

<a
href="../index.html"
class="voltar-site">

← Voltar ao site

</a>

</header>

<!-- MAIN -->
<main class="admin-container">

<!-- DASHBOARD -->
<section class="dashboard-grid">

<div class="dashboard-card">

<span>

Produtos

</span>

<h3 id="totalProdutos">

0

</h3>

</div>

<div class="dashboard-card">

<span>

Pedidos

</span>

<h3 id="totalPedidos">

0

</h3>

</div>

<div class="dashboard-card">

<span>

Tickets

</span>

<h3 id="totalTickets">

0

</h3>

</div>

<div class="dashboard-card">

<span>

Vendas

</span>

<h3 id="totalVendas">

R$ 0

</h3>

</div>

</section>

<!-- CADASTRAR -->
<section class="admin-box">

<h2>

Cadastrar Produto

</h2>

<input
type="text"
id="nome"
placeholder="Nome do produto">

<input
type="number"
id="preco"
placeholder="Preço">

<!-- FOTO -->
<label class="upload-box">

Escolher imagem

<input
type="file"
id="imagemFile"
accept="image/*">

</label>

<!-- PREVIEW -->
<img
id="previewImagem"
style="display:none;">

<!-- CATEGORIA -->
<select id="categoria">

<option value="">

Selecione a categoria

</option>

</select>

<!-- SUB -->
<select id="subcategoria">

<option value="">

Selecione a subcategoria

</option>

</select>

<input
type="text"
id="unidade"
placeholder="Saca 60kg">

<input
type="text"
id="tipoCotacao"
placeholder="milho / soja / boi">

<input
type="number"
id="estoque"
placeholder="Estoque">

<button
type="button"
onclick="cadastrarProduto()">

Cadastrar Produto

</button>

</section>

<!-- PRODUTOS -->
<section class="produtos-admin">

<h2>

Produtos cadastrados

</h2>

<div id="listaProdutos">

</div>

</section>

<!-- TICKETS -->
<section class="tickets-admin-box">

<h2>

Tickets de suporte

</h2>

<div id="ticketsAdmin">

</div>

</section>

</main>

<script type="module" src="/js/main.js"></script>
<script type="module" src="js/firebase.js"></script>
</body>
</html>
