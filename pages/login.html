<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Login
    </title>

    <link rel="stylesheet"
          href="css/global.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <img src="assets/images/logo.png"
             class="login-logo">

        <h1>
            Entrar
        </h1>

        <input type="email"
               id="email"
               placeholder="Seu email">

        <input type="password"
               id="senha"
               placeholder="Sua senha">

        <button onclick="login()">

            Entrar

        </button>

        <p>

            Não possui conta?

            <a href="cadastro.html">
                Criar conta
            </a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
